[project]
name = "ato-pipeline"
version = "0.1.0"
description = "ato-pro corpus pipeline"
requires-python = ">=3.12"
dependencies = [
  "httpx[http2]>=0.27",
  "selectolax>=0.3.21",
  "pydantic>=2.9",
  "sentence-transformers>=3.2",
  "tqdm>=4.66",
  "orjson>=3.10",
  "typer>=0.13",
  "sqlite-vec>=0.1.6",
  "lxml>=5.3",
  "pyzstd>=0.16",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ato_pipeline"]

[project.scripts]
ato-pipeline = "ato_pipeline.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "slow: end-to-end tests that download models or hit the network",
]
