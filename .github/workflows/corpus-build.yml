name: corpus-build

on:
  schedule:
    - cron: "0 3 1 * *"  # 1st of month, 03:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # near GH-hosted limit
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system zstd
        run: sudo apt-get install -y zstd

      - name: Install Python dependencies
        working-directory: packages/pipeline
        run: uv sync

      - name: Build corpus
        working-directory: packages/pipeline
        run: |
          uv run ato-pipeline build \
            --out-dir corpus-out \
            --sources ato_website,legislation,thresholds,law_ato

      - name: Package corpus (manifest + zstd compression)
        working-directory: packages/pipeline
        run: |
          YEAR_MONTH=$(date -u +%Y.%m)
          uv run python -m ato_pipeline.manifest \
            --db corpus-out/ato.sqlite \
            --out corpus-out/manifest.json \
            --zst "corpus-out/ato-corpus-v${YEAR_MONTH}.sqlite.zst"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.2.$(date -u +%Y.%m)"
          gh release create "$TAG" \
            packages/pipeline/corpus-out/*.zst \
            packages/pipeline/corpus-out/manifest.json \
            --title "Corpus $TAG" \
            --notes "Automated monthly corpus build."
