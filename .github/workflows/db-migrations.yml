name: DB Migrations

on:
  pull_request:
  push:
    branches: [main]

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Postgres
        run: supabase db start
      - name: Lint migrations (fail on errors; warnings reported only)
        run: supabase db lint --level warning --fail-on error
      - name: Apply all migrations to a fresh database
        run: supabase db reset
