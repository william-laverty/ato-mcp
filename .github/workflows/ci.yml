name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The OnnxEmbedder test downloads MiniLM from Hugging Face at test time;
      # cache the model so CI isn't exposed to HF rate limiting (429s).
      # Placed after install so pnpm's node_modules relinking can't wipe it.
      - uses: actions/cache@v4
        with:
          path: node_modules/.pnpm/**/@xenova/transformers/.cache
          key: hf-models-${{ runner.os }}-minilm-l6-v2
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test

  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/pipeline } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run pytest -v -k "not slow"
