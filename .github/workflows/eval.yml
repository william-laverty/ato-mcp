name: Retrieval Eval

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 1 * *" # 1st of each month, 14:00 UTC (~00:00 AEST)

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@ato-mcp/backend..."
      - run: pnpm --filter @ato-mcp/shared build
      - name: Run retrieval eval
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: pnpm --filter @ato-mcp/backend eval
