name: npm-publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    # Only software releases (v*). Publishes the unscoped `ato-mcp` client via npm
    # Trusted Publishing (OIDC) — no NPM_TOKEN needed. Requires the package's
    # Trusted Publisher to be configured on npmjs.com (GitHub Actions →
    # william-laverty/ato-mcp → npm-publish.yml). pnpm performs the OIDC exchange.
    # The NPM_PUBLISH_ENABLED gate stays as an explicit publish safety switch.
    if: (github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')) && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC for Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          # NOTE: no registry-url here — it writes an .npmrc _authToken line
          # referencing the unset NODE_AUTH_TOKEN, which breaks the OIDC
          # trusted-publishing exchange (npm returns 404 on the PUT).
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter ato-mcp test
      # Trusted publishing needs npm >= 11.5.1 (Node 22 bundles npm 10.x, which
      # can't do the OIDC exchange and dies with ENEEDAUTH).
      - run: npm install -g npm@latest
      - name: Publish ato-mcp (OIDC trusted publishing)
        working-directory: packages/mcp
        run: |
          npm --version
          npm publish --access public --loglevel http
